<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fant ikke siden – Reiserådkart</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<style>
:root { --bg:#f4f1ec; --text:#1d1d1f; --muted:#66646b; --link:#0b5cad; }
@media (prefers-color-scheme: dark) { :root { --bg:#121316; --text:#ecebef; --muted:#a4a2ab; --link:#7cb6ff; } }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui, -apple-system, sans-serif; }
main { max-width:560px; margin:12vh auto; padding:0 16px; }
a { color:var(--link); }
</style>
</head>
<body>
<main>
  <h1>Fant ikke siden</h1>
  <p id="msg">Adressen finnes ikke. Se <a href="/">verdenskartet</a> eller <a href="/land/">alle land A–Å</a>.</p>
</main>
<script>
// /land/<noe>/ -> finn landet (ny slug, UDs gamle nøkkel eller navnet) og vis det
// på kartet. Land uten reiseadvarsel har ingen egen side, men finnes på kartet.
(async () => {
  const m = location.pathname.match(/^\/land\/([^/]+)\/?$/);
  if (!m) return;
  const want = decodeURIComponent(m[1]).toLowerCase();
  const norm = s => s.toLowerCase().replace(/æ/g, "ae").replace(/ø/g, "o").replace(/å/g, "a")
    .normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "");
  try {
    const info = await (await fetch("/data/info.json")).json();
    const hit = Object.values(info.countries).find(c =>
      c.slug === want || c.key === want || norm(c.name) === norm(want) || norm(c.slug) === norm(want));
    if (!hit) return;
    location.replace(hit.level ? `/land/${hit.slug}/` : `/#${hit.slug}`);
    document.getElementById("msg").textContent = `Sender deg til ${hit.name} …`;
  } catch (e) {}
})();
</script>
</body>
</html>
