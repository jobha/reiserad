name: deploy

# Ved push til main og hver tredje time:
#  - henter UDs reiseråd og bygger kartdata + landsider på den selvhostede
#    runneren på ig68-pi4 (regjeringen.no svarer 403 til GitHubs datasentre,
#    så skrapingen må gå fra en vanlig linje). Siden serveres fra Vercel, så
#    er Pi-en nede, står siden bare med siste data.
#  - deployer site/ til Vercel (LegeOnline-teamet, prosjekt reiserad -> reiserad.no)
#  - committer data/advisories.json når UD har endret noe (historikk i git)
#  - åpner/oppdaterer en issue når en regional advarsel må tegnes inn på nytt
#
# Ingen pull_request-trigger med vilje: repoet er offentlig og jobben har
# tilgang til Vercel-tokenet.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: [self-hosted, reiserad]
    env:
      REISERAD_CACHE: /home/jonasbull/.cache/reiserad
    outputs:
      review: ${{ steps.build.outputs.review }}
      summary: ${{ steps.build.outputs.summary }}
    steps:
      - uses: actions/checkout@v7

      # Pi-en har python3-shapely fra apt; geodata caches i REISERAD_CACHE.
      - name: Hent UDs reiseråd
        run: python3 scraper/scrape.py

      - name: Bygg kartdata og sider
        id: build
        run: |
          set -euo pipefail
          python3 scraper/build.py | tee build.log
          echo "summary=$(tail -1 build.log)" >> "$GITHUB_OUTPUT"
          if grep -q "Endret siden kartlegging: -. Ikke kartlagt: -" build.log; then
            echo "review=0" >> "$GITHUB_OUTPUT"
          else
            echo "review=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Deploy til Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_zV9o9MNyfKaK7ALbJG0H3BR6
          VERCEL_PROJECT_ID: prj_A4KPY2emMzbqty4qnce2hDO5hCx5
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN mangler – hopper over Vercel-deploy."
            exit 0
          fi
          npx --yes vercel@latest deploy site --prod --yes --token "$VERCEL_TOKEN"

      - name: Commit endringer fra UD
        run: |
          set -euo pipefail
          if git diff --quiet -- data/advisories.json; then
            echo "Ingen endringer."
            exit 0
          fi
          # Bare hentetidspunktet endret? Ikke commit det.
          if [ "$(git diff -U0 -- data/advisories.json | grep -c '^[-+] ')" -le 2 ] && \
             git diff -U0 -- data/advisories.json | grep -q '"fetched"'; then
            echo "Bare tidsstempel endret."
            exit 0
          fi
          git config user.name "reiserad-bot"
          git config user.email "reiserad-bot@users.noreply.github.com"
          git add data/advisories.json
          git commit -m "UD: reiseråd oppdatert $(date +%F)"
          git push

  notify:
    needs: build
    if: needs.build.outputs.review == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          SUMMARY: ${{ needs.build.outputs.summary }}
        with:
          script: |
            const title = "Reiseråd endret – regioner må kartlegges";
            const body = `${process.env.SUMMARY}\n\nOppdater \`data/regions.json\`, kjør \`python scraper/build.py --stamp <slug>\` og push.`;
            const { data } = await github.rest.issues.listForRepo({ ...context.repo, state: "open" });
            const open = data.find(i => i.title === title);
            if (!open) await github.rest.issues.create({ ...context.repo, title, body });
            else if (open.body !== body) await github.rest.issues.update({ ...context.repo, issue_number: open.number, body });
