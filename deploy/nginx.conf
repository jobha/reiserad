# nginx for haugsoen-reiserad på ig68-pi4 (~/selfhost/haugsoen/reiserad.nginx.conf,
# montert som /etc/nginx/conf.d/default.conf). Siden serveres fra Vercel på
# reiseråd.no; denne containeren sender bare de gamle adressene
# reiserad.haugsoen.com og reiseråd.haugsoen.com (xn--reiserd-jxa) videre dit.
# Endres den: kopier til Pi-en og kjør `docker exec haugsoen-reiserad nginx -s reload`.
server {
    listen 80 default_server;
    return 301 https://xn--reiserd-jxa.no$request_uri;
}
