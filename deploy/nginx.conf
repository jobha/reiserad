# nginx for haugsoen-reiserad (på ig68-pi4: ~/selfhost/haugsoen/reiserad.nginx.conf,
# montert som /etc/nginx/conf.d/default.conf). Endres den: kopier til Pi-en og
# kjør `docker exec haugsoen-reiserad nginx -s reload`.
server {
    listen 80 default_server;
    root /usr/share/nginx/html;

    # Hovedadressen er reiserad.haugsoen.com; reiseråd (xn--reiserd-jxa) sendes dit.
    if ($host != "reiserad.haugsoen.com") {
        return 301 https://reiserad.haugsoen.com$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }
    location /data/ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml application/xml;
    gzip_min_length 1024;
}
