# nginx-container på Pi-en (montert som /etc/nginx/conf.d/default.conf).
# Siden serveres fra Vercel på reiseråd.no; denne containeren sender bare
# de gamle adressene videre dit.
# Endres den: kopier til Pi-en og kjør `docker exec <container> nginx -s reload`.
server {
    listen 80 default_server;
    return 301 https://xn--reiserd-jxa.no$request_uri;
}
